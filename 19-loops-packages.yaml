- name: Install packages
  hosts: yes
  become: yes
  tasks:
  - name: install packages
    ansible.builtin.package:
      name: "{{ item }}"
      state: "{{ item }}"
    loop:
    - { name: 'git', state: present }
    - { name: 'mysql', state: absent }
    - { name: 'mysql', state: present }
    - { name: 'zip', state: absent }
  